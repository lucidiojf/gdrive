<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Direto - Google Drive</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f1f3f4; margin: 0; padding: 24px 16px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .card { background: #ffffff; width: 100%; max-width: 460px; padding: 28px 24px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a73e8; font-size: 20px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #5f6368; margin-top: 0; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #3c4043; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; background: #fafafa; outline: none; }
    input[type="text"]:focus { border-color: #1a73e8; background: #fff; }
    input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #dadce0; border-radius: 8px; font-size: 13px; background: #f8f9fa; cursor: pointer; }
    button { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #a8c7fa; cursor: not-allowed; }
    #status { margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; text-align: center; word-break: break-all; }
    .sucesso { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; display: block !important; }
    .erro { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; display: block !important; }
    .carregando { background: #e8f0fe; color: #1a73e8; border: 1px solid #d2e3fc; display: block !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📁 Envio p/ Google Drive</h2>
    <p class="sub">Pasta de destino: <b>Painel_Anexos</b></p>

    <div class="field">
      <label for="nomeCustom">Nome do Arquivo (Opcional):</label>
      <input type="text" id="nomeCustom" placeholder="Ex: foto_asus_comprovante">
    </div>

    <div class="field">
      <label for="arquivoInput">Selecione o Arquivo ou Foto:</label>
      <input type="file" id="arquivoInput">
    </div>

    <button id="btnEnviar" onclick="enviarParaDrive()">🚀 Subir para o Drive</button>

    <div id="status"></div>
  </div>

  <script>
    // Cole aqui a sua URL da Web App do Google Apps Script terminada em /exec
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMT1pfaR9rIuDwFvHSRuUo7Ir1ZIev2gujBxLdrkwsM8SH5B9RmvJLWDybP6QGHzgPVQ/exec";

    function enviarParaDrive() {
      const fileInput = document.getElementById("arquivoInput");
      const statusDiv = document.getElementById("status");
      const btn = document.getElementById("btnEnviar");
      const nomeCustom = document.getElementById("nomeCustom").value.trim();

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecione um arquivo primeiro!");
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      statusDiv.className = "carregando";
      statusDiv.innerText = "⏳ Enviando para o Google Drive...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const rawBase64 = e.target.result.split(',')[1];
        
        let nomeFinal = file.name;
        if (nomeCustom) {
          const extIndex = file.name.lastIndexOf('.');
          const ext = extIndex !== -1 ? file.name.substring(extIndex) : '';
          nomeFinal = nomeCustom + ext;
        }

        const payload = {
          action: "upload_painel",
          filename: nomeFinal,
          mimeType: file.type,
          base64: rawBase64
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          if (data.status === "success") {
            statusDiv.className = "sucesso";
            statusDiv.innerHTML = `✅ <b>Salvo no Google Drive!</b><br><br><a href="${data.fileUrl}" target="_blank" style="color:#137333; font-weight:bold; text-decoration:underline;">Visualizar Arquivo no Drive</a>`;
            fileInput.value = "";
            document.getElementById("nomeCustom").value = "";
          } else {
            statusDiv.className = "erro";
            statusDiv.innerText = "❌ Erro ao salvar: " + (data.message || "Erro desconhecido");
          }
        })
        .catch(err => {
          btn.disabled = false;
          statusDiv.className = "erro";
          statusDiv.innerText = "❌ Falha na conexão com o script da Google.";
        });
      };

      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
